<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin EcoPreneur TechFest 2026</title><style>
body{font:15px Arial,sans-serif;background:#f3f8f4;color:#24352b;margin:0;padding:20px}.wrap{max-width:1200px;margin:auto}.card{background:#fff;border:1px solid #d7e7da;border-radius:14px;padding:20px;margin:16px 0}h1,h2{color:#155b3b}input,button,select{font:inherit;padding:10px;border:1px solid #cbdccc;border-radius:8px}button{background:#155b3b;color:#fff;border:0;font-weight:bold;cursor:pointer;margin-right:5px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e1e9e3;text-align:left;vertical-align:top}th{background:#eaf5ec;color:#155b3b}.tablewrap{overflow:auto}.hidden{display:none}.muted{color:#66776c;font-size:13px}.msg{margin:12px 0;font-weight:bold}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body><div class="wrap"><h1>Admin Pendaftaran</h1><p class="muted">EcoPreneur TechFest 2026 · Login diperlukan untuk melihat data peserta.</p>
<div id="login" class="card"><h2>Login Admin</h2><p><input id="email" type="email" placeholder="Email admin" autocomplete="username"></p><p><input id="password" type="password" placeholder="Password" autocomplete="current-password"></p><button id="loginBtn">Masuk</button><div id="loginMsg" class="msg"></div></div>
<div id="dash" class="card hidden"><div class="controls"><h2 style="flex:1">Rekap Pendaftar</h2><button id="logoutBtn">Keluar</button></div><div class="controls"><select id="filter"><option value="all">Semua lomba</option><option value="drawing">Menggambar/Mewarnai</option><option value="ai">AI Solution Challenge</option><option value="both">Kedua lomba</option></select><button id="refresh">Muat ulang</button><button id="csv">Unduh CSV</button></div><div id="msg" class="msg"></div><div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Nama</th><th>Sekolah</th><th>Kelas</th><th>Wilayah</th><th>Lomba</th><th>Kontak</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let db=null,data=[];const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(){if(!window.ECOPRENEUR_CONFIG||(ECOPRENEUR_CONFIG.url.includes('YOUR_PROJECT')||ECOPRENEUR_CONFIG.anonKey.includes('YOUR_SUPABASE'))){$('loginMsg').textContent='Isi config.js dengan kredensial Supabase terlebih dahulu.';return}db=window.supabase.createClient(ECOPRENEUR_CONFIG.url,ECOPRENEUR_CONFIG.anonKey);db.auth.getSession().then(({data:d})=>{if(d.session)showDash()})}
$('loginBtn').onclick=async()=>{if(!db)return;$('loginMsg').textContent='Memeriksa akun...';let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='Login gagal: '+error.message;return}$('loginMsg').textContent='';showDash()};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();$('dash').classList.add('hidden');$('login').classList.remove('hidden')};
function showDash(){$('login').classList.add('hidden');$('dash').classList.remove('hidden');load()}
async function load(){$('msg').textContent='Memuat data...';let {data:d,error}=await db.from('registrations').select('*').order('created_at',{ascending:false}).limit(1000);if(error){$('msg').textContent='Tidak dapat membaca data. Pastikan admin_setup.sql sudah dijalankan dan UUID akun admin sudah dimasukkan ke admin_users. '+error.message;return}data=d||[];render();$('msg').textContent='Total data: '+data.length}
function render(){let f=$('filter').value;let arr=data.filter(x=>f==='all'||x.competition_choice===f);$('rows').innerHTML=arr.map(r=>{let details=[r.drawing_category?'Menggambar: '+r.drawing_category:null,r.team_name?'Tim: '+r.team_name:null,r.ai_category?'Kategori AI: '+r.ai_category:null,r.ai_title?'Ide: '+r.ai_title:null].filter(Boolean).join(' · ');return `<tr><td>${esc(new Date(r.created_at).toLocaleString('id-ID'))}</td><td>${esc(r.full_name)}</td><td>${esc(r.school)}</td><td>${esc(r.grade)}</td><td>${esc(r.region)}</td><td>${esc(r.competition_choice)}</td><td>${esc(r.whatsapp)}<br>${esc(r.email)}</td><td>${esc(details)}</td></tr>`}).join('')}
$('refresh').onclick=load;$('filter').onchange=render;$('csv').onclick=()=>{let f=$('filter').value,arr=data.filter(x=>f==='all'||x.competition_choice===f);if(!arr.length)return;let keys=['created_at','full_name','school','nisn','grade','region','whatsapp','email','competition_choice','drawing_category','drawing_title','team_name','team_size','member2','member3','ai_category','ai_title','ai_problem','ai_solution','ai_link'];let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let csv=[keys.join(','),...arr.map(r=>keys.map(k=>q(r[k])).join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='rekap_ecopreneur_techfest_2026.csv';a.click();URL.revokeObjectURL(a.href)};
start();
</script></body></html>
